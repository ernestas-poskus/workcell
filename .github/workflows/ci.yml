name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint, test, docs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (offline; a fake `nono` stands in for the binary)
        run: cargo nextest run --status-level fail

      - name: Doc-tests
        run: cargo test --doc

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: Package manifest
        run: cargo package --list --allow-dirty >/dev/null

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: rust-version
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "toolchain=${version}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Check against the declared MSRV
        run: cargo check --all-targets
